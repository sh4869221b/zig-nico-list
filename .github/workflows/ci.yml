name: Test CI

# Keep this workflow unfiltered by paths so the aggregate CI check always ends.
# Feature branches are tested by their PR, avoiding push + PR duplicate runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      build: ${{ steps.plan.outputs.build }}
      format: ${{ steps.plan.outputs.format }}
      scripts: ${{ steps.plan.outputs.scripts }}
      docs: ${{ steps.plan.outputs.docs }}
      native: ${{ steps.plan.outputs.native }}
      quality: ${{ steps.plan.outputs.quality }}
    steps:
      - name: Check out event commit and complete diff history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select jobs conservatively from the complete Git diff
        id: plan
        run: python scripts/ci_changes.py

  quality:
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      format: ${{ needs.changes.outputs.format == 'true' }}
      scripts: ${{ needs.changes.outputs.scripts == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native.yml
    with:
      unit: ${{ needs.changes.outputs.unit == 'true' }}
      build: ${{ needs.changes.outputs.build == 'true' }}

  ci:
    name: CI
    if: always()
    needs: [changes, quality, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.changes.result }}
      QUALITY_REQUIRED: ${{ needs.changes.outputs.quality }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
      NATIVE_RESULT: ${{ needs.native.result }}
    steps:
      - name: Require every selected check to succeed
        shell: python
        run: |
          import os
          if os.environ['PLAN_RESULT'] != 'success':
              raise SystemExit('Change selection failed or was cancelled')
          for name in ('QUALITY', 'NATIVE'):
              required = os.environ[name + '_REQUIRED']
              actual = os.environ[name + '_RESULT']
              expected = 'success' if required == 'true' else 'skipped'
              if required not in ('true', 'false') or actual != expected:
                  raise SystemExit(f'{name}: expected {expected}, got {actual}')
          print('All affected checks passed; unneeded jobs were explicitly skipped.')
