name: Native tests and repeat builds

on:
  workflow_call:
    inputs:
      package:
        description: Prepare release inputs; caller gates publication on all jobs
        type: boolean
        default: false
      release_tag:
        description: Explicit version tag for release packaging
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # A separate runner prevents the unit compiler from contending with the two
  # cold release builds. The caller waits for BOTH jobs (and both OSes).
  unit:
    name: ${{ matrix.target }} cached unit tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: windows-2025
            target: windows-x86_64
    env:
      PYTHONUTF8: '1'
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache/unit
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/unit
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test release and cache helpers
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Restore official Zig archive
        id: toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-downloads
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('scripts/install_zig.py') }}
      - name: Install checksum-pinned Zig 0.17.0
        run: python scripts/install_zig.py
      - name: Check Zig formatting
        run: zig fmt --check build.zig src
      - name: Identify hosted runner image
        id: image
        run: python -c "import os; open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write('version=' + os.environ['ImageVersion'] + '\n')"
      - name: Restore exact-source ReleaseSafe compiler cache
        id: unit-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache/unit
            .zig-global-cache/unit
          # No restore-keys: never mix OS/image/CPU/optimization/toolchain/source.
          key: zig-unit-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-0.17.0-${{ matrix.target }}-baseline-safe-${{ hashFiles('scripts/install_zig.py') }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
      - name: Run native unit tests in ReleaseSafe (always execute)
        run: zig build test -Doptimize=safe -Dcpu=baseline --cache-dir .zig-cache/unit --summary all
      - name: Record compiler cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.unit-cache.outputs.cache-hit }}
        run: echo "ReleaseSafe compiler cache exact hit = ${CACHE_HIT:-false}; unit tests executed." >> "$GITHUB_STEP_SUMMARY"
      # PRs may restore public base-branch caches, but this workflow never saves
      # PR caches. No pull_request_target, write token, or cached release output.
      - name: Save verified official Zig archive on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-downloads
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Save successful unit compiler cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.unit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache/unit
            .zig-global-cache/unit
          key: ${{ steps.unit-cache.outputs.cache-primary-key }}

  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            binary: zig-out/bin/zig-nico-list
          - runner: windows-2025
            target: windows-x86_64
            binary: zig-out/bin/zig-nico-list.exe
    env:
      PYTHONUTF8: '1'
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore official Zig archive only (no compiler cache)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-downloads
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('scripts/install_zig.py') }}
      - name: Install checksum-pinned Zig 0.17.0
        run: python scripts/install_zig.py
      - name: Compare two cold native ReleaseFast baseline builds
        # check_build.py overrides BOTH cache directories separately for each
        # build. These builds remain cold even when the unit cache hits.
        run: python scripts/check_build.py
      - name: Run native CLI integration tests on the verified cold build
        env:
          TEST_BINARY: ${{ matrix.binary }}
        shell: bash
        run: python tests/integration.py "$TEST_BINARY"
      - name: Create and compare normalized release archives
        if: inputs.package
        run: python scripts/package_release.py
      - name: Upload verified release inputs
        if: inputs.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
