name: Native cached builds and tests

on:
  workflow_call:
    inputs:
      unit:
        description: Run native ReleaseSafe unit tests
        type: boolean
        default: true
      build:
        description: Build, integrate, and check release packaging
        type: boolean
        default: true
      package:
        description: Prepare release inputs; caller gates publication on all jobs
        type: boolean
        default: false
      release_tag:
        description: Explicit version tag for release packaging
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # A separate runner prevents the unit compiler from contending with the
  # cached executable build. The caller waits for BOTH jobs (and both OSes).
  unit:
    if: inputs.unit
    name: ${{ matrix.target }} cached unit tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: windows-2025
            target: windows-x86_64
    env:
      PYTHONUTF8: '1'
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache/unit
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/unit
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore official Zig archive
        id: toolchain
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-downloads
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('scripts/install_zig.py') }}
      - name: Install checksum-pinned Zig 0.17.0
        run: python scripts/install_zig.py
      - name: Identify hosted runner image
        id: image
        run: python -c "import os; open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write('version=' + os.environ['ImageVersion'] + '\n')"
      - name: Restore exact-source ReleaseSafe compiler cache
        id: unit-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache/unit
            .zig-global-cache/unit
          # No restore-keys: never mix OS/image/CPU/optimization/toolchain/source.
          key: zig-unit-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-0.17.0-${{ matrix.target }}-baseline-safe-${{ hashFiles('scripts/install_zig.py') }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
      - name: Run native unit tests in ReleaseSafe (always execute)
        run: zig build test -Doptimize=safe -Dcpu=baseline --cache-dir .zig-cache/unit --summary all
      - name: Record compiler cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.unit-cache.outputs.cache-hit }}
        run: echo "ReleaseSafe compiler cache exact hit = ${CACHE_HIT:-false}; unit tests executed." >> "$GITHUB_STEP_SUMMARY"
      # PRs may restore public base-branch caches, but this workflow never saves
      # PR caches. No pull_request_target, write token, or cached release output.
      - name: Save verified official Zig archive on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-downloads
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
      - name: Save successful unit compiler cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.unit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache/unit
            .zig-global-cache/unit
          key: ${{ steps.unit-cache.outputs.cache-primary-key }}

  native:
    if: inputs.build
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            binary: zig-out/bin/zig-nico-list
          - runner: windows-2025
            target: windows-x86_64
            binary: zig-out/bin/zig-nico-list.exe
    env:
      PYTHONUTF8: '1'
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache/release-fast
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache/release-fast
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore official Zig archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-downloads
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('scripts/install_zig.py') }}
      - name: Install checksum-pinned Zig 0.17.0
        run: python scripts/install_zig.py
      - name: Identify hosted runner image
        id: image
        run: python -c "import os; open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8').write('version=' + os.environ['ImageVersion'] + '\n')"
      - name: Restore exact-source ReleaseFast compiler cache
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache/release-fast
            .zig-global-cache/release-fast
          key: zig-fast-v1-${{ matrix.runner }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-0.17.0-${{ matrix.target }}-baseline-fast-${{ hashFiles('scripts/install_zig.py', 'scripts/build_cached.py', 'scripts/build_metadata.py') }}-${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig') }}
      - name: Build and identify fresh ReleaseFast output using compiler caches
        run: python scripts/build_cached.py
      - name: Run native CLI integration tests on this cached build
        env:
          TEST_BINARY: ${{ matrix.binary }}
        shell: bash
        run: python tests/integration.py "$TEST_BINARY"
      - name: Recheck executable and source identity after integration
        run: python scripts/build_cached.py --verify-only
      - name: Record executable compiler cache result
        shell: bash
        env:
          CACHE_HIT: ${{ steps.build-cache.outputs.cache-hit }}
        run: echo "ReleaseFast compiler cache exact hit = ${CACHE_HIT:-false}; fresh output and integration checked." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate normalized packaging without publishing
        if: ${{ !inputs.package }}
        run: >-
          python -c "import json,subprocess; info=json.load(open('zig-out/build-info.json',encoding='utf-8')); subprocess.run(['python','scripts/package_release.py','--tag',info['binary_version'].split()[-1]],check=True)"
      - name: Create and compare normalized release archives
        if: inputs.package
        run: python scripts/package_release.py
      - name: Upload verified release inputs
        if: inputs.package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Save successful ReleaseFast compiler cache on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .zig-cache/release-fast
            .zig-global-cache/release-fast
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
