name: Manual cold reproducibility

# Deliberately outside normal Test/Release CI. Select an exact branch or tag
# with Run workflow; this check neither creates nor modifies releases/tags.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cold-reproducibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cold:
    name: ${{ matrix.target }} cold repeat builds
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            binary: zig-out/bin/zig-nico-list
          - runner: windows-2025
            target: windows-x86_64
            binary: zig-out/bin/zig-nico-list.exe
    env:
      PYTHONUTF8: '1'
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore official Zig archive only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .zig-downloads
          key: zig-archive-v1-${{ runner.os }}-${{ runner.arch }}-0.17.0-${{ hashFiles('scripts/install_zig.py') }}
      - name: Install checksum-pinned Zig 0.17.0
        run: python scripts/install_zig.py
      - name: Compare two cold native ReleaseFast baseline builds
        # Each build gets separate empty local AND global compiler caches.
        run: python scripts/check_build.py
      - name: Run integration on the cold-verified executable
        shell: bash
        env:
          TEST_BINARY: ${{ matrix.binary }}
        run: python tests/integration.py "$TEST_BINARY"
      - name: Upload exact-commit cold reproducibility report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cold-reproducibility-${{ matrix.target }}-${{ github.sha }}
          path: zig-out/build-info.json
          if-no-files-found: error
          retention-days: 14
